[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbuildingstack"
version = "0.2.0"
description = "BACnet device and object discovery library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SkyCentrics" }
]
keywords = ["bacnet", "building-automation", "discovery", "bac0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]

dependencies = [
    "BAC0>=24.0.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
network = [
    "netifaces>=0.11.0",
]
ai = [
    "httpx>=0.28.1",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=obs --cov-report=term-missing --cov-report=html --durations=10"
filterwarnings = [
    # AsyncMock auto-creates child coroutines that may be GC'd unawaited
    # across xdist workers — harmless in tests.
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["obs"]
branch = true
data_file = "output/.coverage"
parallel = true

[tool.coverage.html]
directory = "output/htmlcov"

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.0.0",
    "factory-boy>=3.3.3",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version}"
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
